[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.3", features = ["fullstack"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
serde_json = "1.0.149"
web-sys = "0.3.85"
wasm-bindgen = "0.2.108"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", optional = true }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }
rustls = { version = "0.23.36", default-features = false, features = ["std", "ring"], optional = true }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server", "dep:tokio", "dep:axum-server", "dep:rustls"]
