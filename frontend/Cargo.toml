[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.3", features = ["fullstack"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
serde_json = "1.0.149"
web-sys = "0.3.85"
wasm-bindgen = "0.2.108"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.23.0", features = ["serde", "js", "v4"] }
indexmap = "2.14.0"

# TODO: Implement MA-58
# jsonwebtoken = "10.3.0"
# axum-jwt-auth = "0.6.3"

[features]
default = []
web = ["dioxus/web",]
server = ["dioxus/server"]
