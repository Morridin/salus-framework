[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.3", features = ["web", "logger"]}
reqwest = { version = "0.13.1", features = ["http3", "json"]}

[features]
default = []
web = ["dioxus/web"]
webview = ["dioxus/desktop"]
server = ["dioxus/server"]
