[package]
name = "frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.3", features = ["fullstack"]}
dioxus-free-icons = { version = "0.10.0", features = ["codicons"] }
serde_json = "1.0.149"
web-sys = "0.3.83"
wasm-bindgen = "0.2.106"
serde = { version = "1.0.228", features = ["derive"] }

[features]
default = []
web = ["dioxus/web"]
server = ["dioxus/server"]
