<!DOCTYPE html>
<html lang="en-gb">
<head>
    <meta charset="utf-8"/>
    <title>Test Plugin</title>
    <link rel="stylesheet" href="main.css" />
    <script>
        async function loadExternalContent() {
            let request = {
                origin: location.href,
                method: "GET",
                endpoint: "hello-world",
                body: null,
            }
            window.parent.postMessage(JSON.stringify(request));
        }

        window.addEventListener('message', event => {
            if (event.origin !== location.origin) return;
            document.getElementById("externalContent").innerHTML = event.data;

        })
    </script>
</head>
<body>
<noscript>
    JabbaScript doesn't work here. Have you declared this plug-in as static?
</noscript>
<h1>
    It works!
</h1>
<p>
    Hello there!
</p>
<button onclick="loadExternalContent();">
    Load external content
</button>
<p id="externalContent"></p>
</body>
</html>
